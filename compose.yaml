services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wolsar}
      POSTGRES_USER: ${POSTGRES_USER:-wolsar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment: &app_environment
      DATABASE_URL: ${DATABASE_URL}
      DEMO_MODE: ${DEMO_MODE:-false}
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOCAL_AUTH_CODES: ${LOCAL_AUTH_CODES:-false}
      OTP_DELIVERY: ${OTP_DELIVERY:-local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      STORAGE_PATH: /app/uploads
      PUSH_PRIVATE_KEY: ${PUSH_PRIVATE_KEY:-}
      PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY:-}
      PUSH_CONTACT: ${PUSH_CONTACT:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *app_environment
    volumes:
      - uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
